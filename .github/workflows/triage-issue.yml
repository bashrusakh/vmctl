name: Issue Triage

# Thin caller shim for the centralized reusable triage master in bashrusakh/.github.
# Mission, authority rules, mutation surface, managed labels, and Policy-SHA contract
# resolution all live in the master; this file only declares when to call it and what
# the calling job grants.
#
# This is an ADD-ON trial: the existing self-contained .github/workflows/issue-triage.md
# on branch feat/metadata-only-triage is left untouched and is not replaced here.
#
# Note: issues-triggered workflows only run from the repository default branch, so this
# shim is inert until it is merged. It can therefore be reviewed and validated without
# triaging anything.
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage when dispatched manually"
        required: false
        type: string

# The called workflow's jobs request, at most:
#   activation   actions: read, contents: read
#   agent        contents: read, issues: read
#   detection    contents: read
#   safe_outputs issues: write, pull-requests: write
#   conclusion   issues: write, pull-requests: write
# A reusable workflow can only use permissions the calling job already holds, and GitHub
# validates each nested job against this block when the run starts, so the caller must
# grant the full union or the run fails before any job runs. `issues: write` also covers
# the agent's `issues: read` requirement.
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    uses: bashrusakh/.github/.github/workflows/triage-issue.lock.yml@efb7a477f832d0667763a5b5fb1e9c4aaffd26f0
    # The master's BYOK engine reads OLLAMA_API_KEY, which is a repository secret on this
    # repository. Pass it by name: the master declares it under on.workflow_call.secrets.
    # Named passing is least-privilege and is documented to work across repositories,
    # unlike `secrets: inherit` (documented for same organization/enterprise only).
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    with:
      # Must list only files that exist in THIS repository at its DEFAULT-BRANCH head:
      # the master resolves the default-branch head and fails closed, before the agent
      # starts, if a listed file is missing. An issues-triggered workflow only runs from
      # the default branch, so the port branch's files do not count.
      # Verified at vmctl main (1e5cfa0): CONTRIBUTING.md present; AGENTS.md absent;
      # `.github/triage-policy.md` absent (it lands on main only with the metadata-only
      # triage work in PR #2 / branch feat/metadata-only-triage). Adding the policy here
      # now would fail closed. Extend this list to
      # ".github/triage-policy.md CONTRIBUTING.md" once PR #2 merges, so triage reads the
      # repository's own triage policy.
      contract_files: "CONTRIBUTING.md"
