name: PR Metadata Triage

# Thin caller shim intentionally trusting bashrusakh/.github@main. Central updates
# (including model/endpoint changes) apply automatically; this is not an immutable pin.
# Provision TRIAGE_API_KEY for the central provider; forward only this named secret.
# The contract is read from THIS repository's
# PR base branch, never from the PR head (or from the default-branch head when the event
# carries no pull request): the master fetches the contract_files below and fails closed
# if a listed file is missing. vmctl's main has CONTRIBUTING.md but no AGENTS.md and no
# .github/triage-policy.md, so only CONTRIBUTING.md is listed.
# The permissions are the union the called workflow's jobs require; issues:write and
# pull-requests:write are the write scopes (actions:read/contents:read cover the rest).
# Inert until merged: pull_request_target runs only workflows that exist on the default branch.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Informational pull request number for a manual run."
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    uses: bashrusakh/.github/.github/workflows/triage-pr.lock.yml@main
    secrets:
      TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
    with:
      contract_files: "CONTRIBUTING.md"
      pr_number: ${{ github.event.inputs.pr_number }}
